<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" role="img" aria-labelledby="ky-title">
  <title id="ky-title">Why keys matter. A list of rows for Ana and Bo, each holding its own state, gets a new row, Cy, inserted at the top. With the array index as the key, React matches rows by position: the row with key 0 is now Cy but keeps Ana's state, the row with key 1 is now Ana but keeps Bo's state, and Bo gets a new row. With the name as the key, React matches Ana to Ana and Bo to Bo, keeps their state, and creates a new row for Cy.</title>
  <defs>
    <marker id="ky-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- key = index -->
  <text class="mono" x="0" y="16">key={index}</text>
  <text class="sm" x="60" y="40" text-anchor="middle">before</text>
  <text class="sm" x="245" y="40" text-anchor="middle">after inserting Cy</text>

  <rect class="box" x="0" y="52" width="120" height="40" rx="6"/>
  <text x="60" y="69" text-anchor="middle">0 · Ana</text>
  <text class="sm" x="60" y="85" text-anchor="middle">note for Ana</text>
  <rect class="box" x="0" y="100" width="120" height="40" rx="6"/>
  <text x="60" y="117" text-anchor="middle">1 · Bo</text>
  <text class="sm" x="60" y="133" text-anchor="middle">note for Bo</text>

  <rect class="box-accent" x="180" y="52" width="130" height="40" rx="6"/>
  <text x="245" y="69" text-anchor="middle">0 · Cy</text>
  <text class="sm accent" x="245" y="85" text-anchor="middle">note for Ana ✗</text>
  <rect class="box-accent" x="180" y="100" width="130" height="40" rx="6"/>
  <text x="245" y="117" text-anchor="middle">1 · Ana</text>
  <text class="sm accent" x="245" y="133" text-anchor="middle">note for Bo ✗</text>
  <rect class="box" x="180" y="148" width="130" height="40" rx="6"/>
  <text x="245" y="165" text-anchor="middle">2 · Bo</text>
  <text class="sm" x="245" y="181" text-anchor="middle">new state</text>

  <line class="wire" x1="120" y1="72" x2="178" y2="72" marker-end="url(#ky-arrow)"/>
  <line class="wire" x1="120" y1="120" x2="178" y2="120" marker-end="url(#ky-arrow)"/>

  <text class="sm" x="0" y="216">Matched by position: the state</text>
  <text class="sm" x="0" y="232">stays in the slot, not with the item.</text>

  <line class="sep" x1="340" y1="0" x2="340" y2="240"/>

  <!-- key = name -->
  <text class="mono" x="370" y="16">key={name}</text>
  <text class="sm" x="430" y="40" text-anchor="middle">before</text>
  <text class="sm" x="615" y="40" text-anchor="middle">after inserting Cy</text>

  <rect class="box" x="370" y="52" width="120" height="40" rx="6"/>
  <text x="430" y="69" text-anchor="middle">Ana</text>
  <text class="sm" x="430" y="85" text-anchor="middle">note for Ana</text>
  <rect class="box" x="370" y="100" width="120" height="40" rx="6"/>
  <text x="430" y="117" text-anchor="middle">Bo</text>
  <text class="sm" x="430" y="133" text-anchor="middle">note for Bo</text>

  <rect class="box" x="550" y="52" width="130" height="40" rx="6"/>
  <text x="615" y="69" text-anchor="middle">Cy</text>
  <text class="sm" x="615" y="85" text-anchor="middle">new state</text>
  <rect class="box-accent" x="550" y="100" width="130" height="40" rx="6"/>
  <text x="615" y="117" text-anchor="middle">Ana</text>
  <text class="sm accent" x="615" y="133" text-anchor="middle">note for Ana ✓</text>
  <rect class="box-accent" x="550" y="148" width="130" height="40" rx="6"/>
  <text x="615" y="165" text-anchor="middle">Bo</text>
  <text class="sm accent" x="615" y="181" text-anchor="middle">note for Bo ✓</text>

  <line class="wire-accent" x1="490" y1="72" x2="548" y2="120" marker-end="url(#ky-arrow)"/>
  <line class="wire-accent" x1="490" y1="120" x2="548" y2="168" marker-end="url(#ky-arrow)"/>

  <text class="sm" x="370" y="216">Matched by key: the state follows</text>
  <text class="sm" x="370" y="232">the item wherever it moves.</text>
</svg>
