<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 226" role="img" aria-labelledby="rc-title">
  <title id="rc-title">The life of an update. First something triggers a render: the initial render or a state update. In the render phase React calls your components and compares the result with the previous tree; this phase must be pure and can be paused, restarted or discarded. In the commit phase React applies the changes to the DOM and runs layout effects, in one go, once the whole tree has been evaluated. The browser then paints the new frame, and after that React runs the useEffect callbacks, cleanups first.</title>
  <defs>
    <marker id="rc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="0" y="20" width="120" height="44" rx="6"/>
  <text class="strong" x="60" y="47" text-anchor="middle">1 · Trigger</text>
  <line class="wire" x1="120" y1="42" x2="138" y2="42" marker-end="url(#rc-arrow)"/>

  <rect class="box-accent" x="140" y="20" width="120" height="44" rx="6"/>
  <text class="strong" x="200" y="47" text-anchor="middle">2 · Render</text>
  <line class="wire" x1="260" y1="42" x2="278" y2="42" marker-end="url(#rc-arrow)"/>

  <rect class="solid" x="280" y="20" width="120" height="44" rx="6"/>
  <text class="strong on-solid" x="340" y="47" text-anchor="middle">3 · Commit</text>
  <line class="wire" x1="400" y1="42" x2="418" y2="42" marker-end="url(#rc-arrow)"/>

  <rect class="box" x="420" y="20" width="120" height="44" rx="6"/>
  <text class="strong" x="480" y="47" text-anchor="middle">Paint</text>
  <line class="wire" x1="540" y1="42" x2="558" y2="42" marker-end="url(#rc-arrow)"/>

  <rect class="box" x="560" y="20" width="120" height="44" rx="6"/>
  <text class="strong" x="620" y="47" text-anchor="middle">Effects</text>

  <text class="sm" x="60" y="90" text-anchor="middle">initial render,</text>
  <text class="sm" x="60" y="106" text-anchor="middle">or a state update</text>
  <text class="sm" x="200" y="90" text-anchor="middle">React calls your</text>
  <text class="sm" x="200" y="106" text-anchor="middle">components and diffs</text>
  <text class="sm" x="200" y="122" text-anchor="middle">the new tree</text>
  <text class="sm" x="340" y="90" text-anchor="middle">React changes the</text>
  <text class="sm" x="340" y="106" text-anchor="middle">DOM and runs</text>
  <text class="sm" x="340" y="122" text-anchor="middle">layout effects</text>
  <text class="sm" x="480" y="90" text-anchor="middle">the browser draws</text>
  <text class="sm" x="480" y="106" text-anchor="middle">the new frame</text>
  <text class="sm" x="620" y="90" text-anchor="middle">useEffect callbacks</text>
  <text class="sm" x="620" y="106" text-anchor="middle">run, cleanups first</text>

  <rect class="box-accent" x="140" y="150" width="120" height="48" rx="4"/>
  <text class="sm accent" x="200" y="170" text-anchor="middle">pure; can be paused,</text>
  <text class="sm accent" x="200" y="186" text-anchor="middle">restarted or dropped</text>
  <rect class="solid" x="280" y="150" width="120" height="48" rx="4"/>
  <text class="sm on-solid" x="340" y="170" text-anchor="middle">in one go, when the</text>
  <text class="sm on-solid" x="340" y="186" text-anchor="middle">whole tree is ready</text>
  <text class="sm" x="420" y="178">nothing reaches the screen</text>
  <text class="sm" x="420" y="194">until the commit</text>
</svg>
