<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="rs-title">
  <title id="rs-title">How Server Components reach the browser, as in Next.js. On the server, Server Components, which can be async and read data directly, are rendered into the RSC payload, a serialised description of the tree with placeholders for Client Components. The payload and the Client Components are used to prerender HTML. In the browser, the HTML is shown first as a fast, non-interactive preview; the RSC payload is used to reconcile the server and client trees; and the JavaScript for the Client Components hydrates them, making the page interactive.</title>
  <defs>
    <marker id="rs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="zone" x="1" y="1" width="298" height="266" rx="8"/>
  <text class="sm" x="14" y="22">On the server</text>
  <rect class="zone" x="381" y="1" width="298" height="266" rx="8"/>
  <text class="sm" x="394" y="22">In the browser</text>

  <rect class="box-accent" x="20" y="38" width="260" height="50" rx="6"/>
  <text class="strong" x="150" y="59" text-anchor="middle">Server Components</text>
  <text class="sm" x="150" y="77" text-anchor="middle">async; may read data directly</text>
  <line class="wire" x1="80" y1="88" x2="80" y2="122" marker-end="url(#rs-arrow)"/>

  <rect class="solid" x="20" y="124" width="120" height="48" rx="6"/>
  <text class="strong on-solid" x="80" y="145" text-anchor="middle">RSC payload</text>
  <text class="sm on-solid" x="80" y="162" text-anchor="middle">serialised tree</text>
  <line class="wire" x1="140" y1="148" x2="158" y2="148" marker-end="url(#rs-arrow)"/>

  <rect class="box" x="160" y="124" width="120" height="48" rx="6"/>
  <text class="strong" x="220" y="145" text-anchor="middle">HTML</text>
  <text class="sm" x="220" y="162" text-anchor="middle">prerendered</text>

  <rect class="box" x="20" y="208" width="260" height="44" rx="6"/>
  <text class="strong" x="150" y="227" text-anchor="middle">Client Components</text>
  <text class="sm" x="150" y="243" text-anchor="middle">JS for 'use client' modules</text>

  <rect class="box" x="400" y="38" width="260" height="50" rx="6"/>
  <text class="strong" x="530" y="59" text-anchor="middle">1 · HTML</text>
  <text class="sm" x="530" y="77" text-anchor="middle">a fast, non-interactive preview</text>
  <rect class="box-accent" x="400" y="124" width="260" height="48" rx="6"/>
  <text class="strong" x="530" y="145" text-anchor="middle">2 · RSC payload</text>
  <text class="sm" x="530" y="162" text-anchor="middle">reconciles server and client trees</text>
  <rect class="solid" x="400" y="208" width="260" height="44" rx="6"/>
  <text class="strong on-solid" x="530" y="227" text-anchor="middle">3 · JavaScript</text>
  <text class="sm on-solid" x="530" y="243" text-anchor="middle">hydrates the Client Components</text>

  <path class="wire" d="M220 124 V106 H330 V63 H398" marker-end="url(#rs-arrow)"/>
  <path class="wire" d="M80 172 V190 H340 V148 H398" marker-end="url(#rs-arrow)"/>
  <line class="wire" x1="280" y1="230" x2="398" y2="230" marker-end="url(#rs-arrow)"/>
</svg>
