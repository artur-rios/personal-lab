<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="inj-title">
  <title id="inj-title">Dependency injection, before and after. Before: the signup service creates its own SMTP mailer with new, so the dependency is fixed inside the class and hidden from anyone using it. After: the signup service only asks, in its constructor, for something that satisfies the Mailer interface. The composition root at the program's entry point decides what that is: the SMTP mailer in production, or an outbox mailer that records messages in a test. Both implement the interface, and the service never names either of them.</title>
  <defs>
    <marker id="inj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="inj-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Before -->
  <rect class="zone" x="0" y="0" width="236" height="288" rx="8"/>
  <text class="strong" x="14" y="24">Before</text>
  <text class="sm" x="14" y="42">the class builds what it needs</text>

  <rect class="box" x="18" y="62" width="200" height="74" rx="6"/>
  <text class="strong" x="32" y="86">SignupService</text>
  <text class="mono" x="32" y="108">self.mailer =</text>
  <text class="mono" x="32" y="126">  SmtpMailer()</text>

  <rect class="box" x="18" y="196" width="200" height="52" rx="6"/>
  <text class="strong" x="32" y="227">SmtpMailer</text>
  <line class="wire" x1="118" y1="136" x2="118" y2="192" marker-end="url(#inj-arrow)"/>
  <text class="sm" x="128" y="168">creates</text>
  <text class="sm" x="118" y="274" text-anchor="middle">fixed and hidden</text>

  <!-- After -->
  <rect class="zone" x="256" y="0" width="424" height="288" rx="8"/>
  <text class="strong" x="270" y="24">After</text>
  <text class="sm" x="270" y="42">the class states what it needs; the caller supplies it</text>

  <rect class="box" x="274" y="62" width="200" height="74" rx="6"/>
  <text class="strong" x="288" y="86">SignupService</text>
  <text class="mono" x="288" y="108">__init__(self,</text>
  <text class="mono" x="288" y="126">  mailer: Mailer)</text>

  <rect class="box-accent" x="490" y="62" width="172" height="74" rx="6"/>
  <text class="strong" x="504" y="86">Composition root</text>
  <text class="sm" x="504" y="106">at the entry point:</text>
  <text class="sm" x="504" y="124">decides and wires</text>
  <line class="wire-accent" x1="488" y1="99" x2="478" y2="99" marker-end="url(#inj-arrow-accent)"/>
  <text class="sm" x="483" y="152" text-anchor="middle">passes in</text>

  <rect class="box" x="274" y="164" width="200" height="40" rx="6"/>
  <text class="mono" x="288" y="189">Mailer (interface)</text>
  <line class="wire" x1="374" y1="136" x2="374" y2="160" marker-end="url(#inj-arrow)"/>

  <rect class="box" x="274" y="232" width="128" height="40" rx="6"/>
  <text class="mono" x="288" y="257">SmtpMailer</text>
  <rect class="box" x="420" y="232" width="128" height="40" rx="6"/>
  <text class="mono" x="434" y="257">OutboxMailer</text>
  <line class="wire" x1="338" y1="232" x2="338" y2="208" marker-end="url(#inj-arrow)"/>
  <line class="wire" x1="484" y1="232" x2="430" y2="206" marker-end="url(#inj-arrow)"/>
  <text class="sm" x="562" y="244">implement</text>
  <text class="sm" x="562" y="262">the interface</text>
</svg>
