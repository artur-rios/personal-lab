<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" role="img" aria-labelledby="life-title">
  <title id="life-title">Service lifetimes in a container, across two requests. Each request gets its own scope. Inside request 1, the checkout service is resolved twice and is a new object each time, because it is transient; both copies share the one database object of that scope, because the database is scoped. Request 2 gets a different database object of its own. The clock is a singleton, so one clock object, owned by the root container, is shared by everything in both requests.</title>
  <defs>
    <marker id="life-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="life-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Root container and the singleton -->
  <rect class="zone" x="0" y="0" width="680" height="316" rx="8"/>
  <text class="sm" x="14" y="22">root container</text>
  <rect class="solid" x="270" y="34" width="140" height="44" rx="6"/>
  <text class="strong on-solid" x="340" y="54" text-anchor="middle">Clock</text>
  <text class="sm on-solid" x="340" y="70" text-anchor="middle">singleton: one, ever</text>

  <!-- Request 1 -->
  <rect class="zone" x="18" y="100" width="312" height="200" rx="8"/>
  <text class="sm" x="32" y="122">scope: request 1</text>
  <rect class="box" x="34" y="136" width="130" height="50" rx="6"/>
  <text class="strong" x="46" y="157">Checkout #1</text>
  <text class="sm" x="46" y="175">transient</text>
  <rect class="box" x="184" y="136" width="130" height="50" rx="6"/>
  <text class="strong" x="196" y="157">Checkout #2</text>
  <text class="sm" x="196" y="175">transient</text>
  <rect class="box-accent" x="109" y="232" width="130" height="50" rx="6"/>
  <text class="strong" x="121" y="253">Database A</text>
  <text class="sm" x="121" y="271">scoped</text>
  <line class="wire" x1="99" y1="186" x2="150" y2="228" marker-end="url(#life-arrow)"/>
  <line class="wire" x1="249" y1="186" x2="198" y2="228" marker-end="url(#life-arrow)"/>

  <!-- Request 2 -->
  <rect class="zone" x="350" y="100" width="312" height="200" rx="8"/>
  <text class="sm" x="364" y="122">scope: request 2</text>
  <rect class="box" x="366" y="136" width="130" height="50" rx="6"/>
  <text class="strong" x="378" y="157">Checkout #3</text>
  <text class="sm" x="378" y="175">transient</text>
  <rect class="box" x="516" y="136" width="130" height="50" rx="6"/>
  <text class="strong" x="528" y="157">Checkout #4</text>
  <text class="sm" x="528" y="175">transient</text>
  <rect class="box-accent" x="441" y="232" width="130" height="50" rx="6"/>
  <text class="strong" x="453" y="253">Database B</text>
  <text class="sm" x="453" y="271">scoped</text>
  <line class="wire" x1="431" y1="186" x2="482" y2="228" marker-end="url(#life-arrow)"/>
  <line class="wire" x1="581" y1="186" x2="530" y2="228" marker-end="url(#life-arrow)"/>

  <!-- Everyone shares the clock -->
  <line class="wire-accent" x1="99" y1="136" x2="268" y2="66" marker-end="url(#life-arrow-accent)"/>
  <line class="wire-accent" x1="249" y1="136" x2="300" y2="80" marker-end="url(#life-arrow-accent)"/>
  <line class="wire-accent" x1="431" y1="136" x2="380" y2="80" marker-end="url(#life-arrow-accent)"/>
  <line class="wire-accent" x1="581" y1="136" x2="412" y2="66" marker-end="url(#life-arrow-accent)"/>
</svg>
