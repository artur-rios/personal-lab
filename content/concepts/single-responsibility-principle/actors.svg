<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="srp-actors-title">
  <title id="srp-actors-title">One Order class answering to three actors. Finance uses its revenue method, the storefront uses its receipt method and the platform team uses its save method. The revenue and receipt methods both call one shared private helper, the line amount. When the storefront asks for prices with VAT on the receipt and the helper is changed to suit it, finance's revenue figure changes with it, although finance asked for nothing.</title>
  <defs>
    <marker id="srpa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="srpa-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect class="box" x="0" y="34" width="130" height="56" rx="6"/>
  <text class="strong" x="14" y="58">Finance</text>
  <text class="sm" x="14" y="76">books revenue</text>

  <rect class="box" x="0" y="124" width="130" height="56" rx="6"/>
  <text class="strong" x="14" y="148">Storefront</text>
  <text class="sm" x="14" y="166">shows receipts</text>

  <rect class="box" x="0" y="214" width="130" height="56" rx="6"/>
  <text class="strong" x="14" y="238">Platform team</text>
  <text class="sm" x="14" y="256">stores orders</text>

  <!-- The class -->
  <rect class="zone" x="180" y="0" width="322" height="288" rx="8"/>
  <text class="strong" x="194" y="24">Order</text>

  <rect class="box" x="200" y="40" width="136" height="44" rx="6"/>
  <text class="mono" x="214" y="67">revenue()</text>
  <rect class="box" x="200" y="130" width="136" height="44" rx="6"/>
  <text class="mono" x="214" y="157">receipt()</text>
  <rect class="box" x="200" y="220" width="136" height="44" rx="6"/>
  <text class="mono" x="214" y="247">save()</text>

  <line class="wire" x1="130" y1="62" x2="196" y2="62" marker-end="url(#srpa-arrow)"/>
  <line class="wire" x1="130" y1="152" x2="196" y2="152" marker-end="url(#srpa-arrow)"/>
  <line class="wire" x1="130" y1="242" x2="196" y2="242" marker-end="url(#srpa-arrow)"/>

  <rect class="box-accent" x="362" y="85" width="124" height="44" rx="6"/>
  <text class="mono" x="372" y="112">_line_amount()</text>
  <line class="wire-accent" x1="336" y1="64" x2="360" y2="94" marker-end="url(#srpa-arrow-accent)"/>
  <line class="wire-accent" x1="336" y1="150" x2="360" y2="122" marker-end="url(#srpa-arrow-accent)"/>
  <text class="sm" x="424" y="150" text-anchor="middle">one helper,</text>
  <text class="sm" x="424" y="166" text-anchor="middle">two actors</text>

  <!-- What goes wrong -->
  <text class="sm" x="520" y="72">The storefront asks</text>
  <text class="sm" x="520" y="90">for VAT on receipts.</text>
  <text class="sm" x="520" y="108">The helper changes,</text>
  <text class="sm" x="520" y="126">and finance's revenue</text>
  <text class="sm accent" x="520" y="144">changes with it.</text>
</svg>
