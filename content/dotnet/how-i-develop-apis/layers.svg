<svg xmlns="http://www.w3.org/2000/svg" style="white-space: pre" viewBox="0 0 680 400" role="img" aria-labelledby="layers-title">
  <title id="layers-title">The six projects of an API and the references between them. The Web API project at the top is the composition root and references the Application projects and the Data project. Inside Application, Command and Query each reference Shared. Application and Data both reference Domain, which references nothing. Command and Query never reference Data: they reach the database through repository interfaces that Data implements.</title>
  <defs>
    <marker id="layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="solid" x="180" y="10" width="320" height="70" rx="8"/>
  <text class="strong on-solid" x="340" y="38" text-anchor="middle">WebApi</text>
  <text class="sm on-solid" x="340" y="60" text-anchor="middle">Presentation · the composition root</text>

  <rect class="zone" x="0" y="120" width="440" height="180" rx="10"/>
  <text class="sm" x="14" y="140">Application</text>

  <rect class="box-accent" x="20" y="152" width="190" height="64" rx="8"/>
  <text class="strong" x="115" y="178" text-anchor="middle">Command</text>
  <text class="sm" x="115" y="198" text-anchor="middle">writes: commands, handlers</text>

  <rect class="box-accent" x="230" y="152" width="190" height="64" rx="8"/>
  <text class="strong" x="325" y="178" text-anchor="middle">Query</text>
  <text class="sm" x="325" y="198" text-anchor="middle">reads: queries, handlers</text>

  <rect class="box" x="125" y="236" width="190" height="52" rx="8"/>
  <text class="strong" x="220" y="258" text-anchor="middle">Shared</text>
  <text class="sm" x="220" y="277" text-anchor="middle">messages, status maps</text>

  <line class="wire" x1="115" y1="216" x2="178" y2="234" marker-end="url(#layers-arrow)"/>
  <line class="wire" x1="325" y1="216" x2="262" y2="234" marker-end="url(#layers-arrow)"/>

  <text class="sm" x="580" y="140" text-anchor="middle">Infrastructure</text>
  <rect class="box" x="480" y="152" width="200" height="64" rx="8"/>
  <text class="strong" x="580" y="178" text-anchor="middle">Data</text>
  <text class="sm" x="580" y="198" text-anchor="middle">EF Core maps, migrations</text>

  <rect class="box" x="240" y="330" width="200" height="60" rx="8"/>
  <text class="strong" x="340" y="356" text-anchor="middle">Domain</text>
  <text class="sm" x="340" y="376" text-anchor="middle">entities, enums, ports</text>

  <line class="wire" x1="300" y1="80" x2="300" y2="118" marker-end="url(#layers-arrow)"/>
  <path class="wire" d="M460 80 V108 H580 V150" marker-end="url(#layers-arrow)"/>
  <line class="wire" x1="340" y1="300" x2="340" y2="328" marker-end="url(#layers-arrow)"/>
  <path class="wire" d="M580 216 V360 H442" marker-end="url(#layers-arrow)"/>

  <text class="sm" x="580" y="260" text-anchor="middle">no arrow from Application</text>
  <text class="sm" x="580" y="277" text-anchor="middle">to Data: only interfaces</text>
</svg>
