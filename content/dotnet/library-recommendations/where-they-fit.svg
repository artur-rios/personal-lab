<svg xmlns="http://www.w3.org/2000/svg" style="white-space: pre" viewBox="0 0 680 300" role="img" aria-labelledby="libs-title">
  <title id="libs-title">Where each library sits in a typical .NET project. Inside the application, an ASP.NET Core API or worker service, FluentValidation checks what comes in, such as requests and commands; Polly guards what goes out, such as HTTP calls, databases and queues; TickerQ runs work later, as one-off and cron jobs; and ClosedXML reads and writes Excel files for reports and imports. In the test project, which tests every part of the application, xUnit.net runs the tests, Bogus generates fake data, and Moq with Moq.AutoMocker fakes the dependencies.</title>
  <defs>
    <marker id="libs-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="zone" x="0" y="10" width="680" height="152" rx="8"/>
  <text class="strong" x="16" y="34">Application: an ASP.NET Core API or a worker service</text>

  <rect class="box-accent" x="16" y="50" width="152" height="96" rx="8"/>
  <text class="strong" x="92" y="78" text-anchor="middle">FluentValidation</text>
  <text class="sm" x="92" y="100" text-anchor="middle">checks what comes in</text>
  <text class="sm" x="92" y="118" text-anchor="middle">requests, commands</text>

  <rect class="box-accent" x="184" y="50" width="152" height="96" rx="8"/>
  <text class="strong" x="260" y="78" text-anchor="middle">Polly</text>
  <text class="sm" x="260" y="100" text-anchor="middle">guards what goes out</text>
  <text class="sm" x="260" y="118" text-anchor="middle">HTTP, databases, queues</text>

  <rect class="box-accent" x="352" y="50" width="152" height="96" rx="8"/>
  <text class="strong" x="428" y="78" text-anchor="middle">TickerQ</text>
  <text class="sm" x="428" y="100" text-anchor="middle">runs work later</text>
  <text class="sm" x="428" y="118" text-anchor="middle">one-off and cron jobs</text>

  <rect class="box-accent" x="520" y="50" width="152" height="96" rx="8"/>
  <text class="strong" x="596" y="78" text-anchor="middle">ClosedXML</text>
  <text class="sm" x="596" y="100" text-anchor="middle">reads and writes Excel</text>
  <text class="sm" x="596" y="118" text-anchor="middle">reports, imports</text>

  <line class="wire-accent" x1="340" y1="198" x2="340" y2="165" marker-end="url(#libs-arrow-accent)"/>
  <text class="sm" x="352" y="186">tests every part</text>

  <rect class="zone" x="0" y="200" width="680" height="96" rx="8"/>
  <text class="strong" x="16" y="224">Test project</text>

  <rect class="solid" x="16" y="236" width="200" height="50" rx="8"/>
  <text class="strong on-solid" x="116" y="257" text-anchor="middle">xUnit.net</text>
  <text class="sm on-solid" x="116" y="276" text-anchor="middle">runs the tests</text>

  <rect class="box" x="232" y="236" width="200" height="50" rx="8"/>
  <text class="strong" x="332" y="257" text-anchor="middle">Bogus</text>
  <text class="sm" x="332" y="276" text-anchor="middle">generates the test data</text>

  <rect class="box" x="448" y="236" width="224" height="50" rx="8"/>
  <text class="strong" x="560" y="257" text-anchor="middle">Moq + Moq.AutoMocker</text>
  <text class="sm" x="560" y="276" text-anchor="middle">fake the dependencies</text>
</svg>
