<svg xmlns="http://www.w3.org/2000/svg" style="white-space: pre" viewBox="0 0 680 270" role="img" aria-labelledby="invocation-title">
  <title id="invocation-title">How a multicast delegate is built and invoked. The delegate original has an invocation list with one entry, first. Combining it with += builds a new delegate, chain, whose invocation list has three entries: first, second and third; original is left unchanged. Calling chain(5) calls first(5), which returns 6, then second(5), which returns 50, then third(5), which returns 4. The results of first and second are discarded, and the call returns 4, the value of the last entry.</title>
  <defs>
    <marker id="invocation-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="invocation-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="0" y="20" width="200" height="104" rx="8"/>
  <text class="strong" x="100" y="44" text-anchor="middle">original</text>
  <text class="sm" x="100" y="62" text-anchor="middle">invocation list: 1 entry</text>
  <rect class="box-accent" x="46" y="78" width="108" height="32" rx="6"/>
  <text class="mono" x="100" y="99" text-anchor="middle">first</text>

  <line class="wire-accent" x1="200" y1="72" x2="278" y2="72" marker-end="url(#invocation-arrow-accent)"/>
  <text class="mono accent" x="239" y="62" text-anchor="middle">+=</text>
  <text class="sm" x="239" y="92" text-anchor="middle">new object</text>

  <rect class="box" x="280" y="20" width="400" height="104" rx="8"/>
  <text class="strong" x="480" y="44" text-anchor="middle">chain</text>
  <text class="sm" x="480" y="62" text-anchor="middle">invocation list: 3 entries, in the order they were added</text>
  <rect class="box-accent" x="296" y="78" width="108" height="32" rx="6"/>
  <text class="mono" x="350" y="99" text-anchor="middle">first</text>
  <rect class="box-accent" x="420" y="78" width="108" height="32" rx="6"/>
  <text class="mono" x="474" y="99" text-anchor="middle">second</text>
  <rect class="box-accent" x="544" y="78" width="108" height="32" rx="6"/>
  <text class="mono" x="598" y="99" text-anchor="middle">third</text>
  <line class="wire" x1="404" y1="94" x2="418" y2="94" marker-end="url(#invocation-arrow)"/>
  <line class="wire" x1="528" y1="94" x2="542" y2="94" marker-end="url(#invocation-arrow)"/>

  <rect class="box" x="0" y="168" width="200" height="44" rx="8"/>
  <text class="mono strong" x="100" y="195" text-anchor="middle">chain(5)</text>
  <line class="wire" x1="200" y1="190" x2="294" y2="190" marker-end="url(#invocation-arrow)"/>

  <rect class="box" x="296" y="168" width="108" height="44" rx="6"/>
  <text class="mono" x="350" y="195" text-anchor="middle">first(5) = 6</text>
  <rect class="box" x="420" y="168" width="108" height="44" rx="6"/>
  <text class="mono" x="474" y="195" text-anchor="middle">second(5) = 50</text>
  <rect class="solid" x="544" y="168" width="108" height="44" rx="6"/>
  <text class="mono on-solid" x="598" y="195" text-anchor="middle">third(5) = 4</text>
  <line class="wire" x1="404" y1="190" x2="418" y2="190" marker-end="url(#invocation-arrow)"/>
  <line class="wire" x1="528" y1="190" x2="542" y2="190" marker-end="url(#invocation-arrow)"/>

  <text class="sm" x="412" y="238" text-anchor="middle">results discarded</text>
  <text class="sm accent" x="598" y="238" text-anchor="middle">returned: 4</text>
  <text class="sm" x="100" y="238" text-anchor="middle">same arguments to each</text>
</svg>
