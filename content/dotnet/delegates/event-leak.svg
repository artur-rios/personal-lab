<svg xmlns="http://www.w3.org/2000/svg" style="white-space: pre" viewBox="0 0 680 250" role="img" aria-labelledby="leak-title">
  <title id="leak-title">Why an event subscription keeps the subscriber alive. A long-lived reference, such as a static field or a singleton, holds the Clock, the publisher. The Clock's Tick event is a delegate field. Its invocation list entry stores Target, the screen object, and Method, OnTick. So the Screen, the subscriber with its one-megabyte buffer, stays reachable through the clock even when nothing else references it. Unsubscribing with clock.Tick -= screen.OnTick removes the entry and breaks the chain.</title>
  <defs>
    <marker id="leak-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="leak-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="zone" x="0" y="20" width="180" height="70" rx="8"/>
  <text class="strong" x="90" y="48" text-anchor="middle">GC root</text>
  <text class="sm" x="90" y="68" text-anchor="middle">static field, singleton…</text>
  <line class="wire" x1="180" y1="55" x2="228" y2="55" marker-end="url(#leak-arrow)"/>

  <rect class="box" x="230" y="10" width="200" height="120" rx="8"/>
  <text class="strong" x="330" y="34" text-anchor="middle">Clock (publisher)</text>
  <text class="sm" x="330" y="52" text-anchor="middle">lives as long as the app</text>
  <rect class="box-accent" x="246" y="68" width="168" height="48" rx="6"/>
  <text class="mono" x="330" y="89" text-anchor="middle">Tick</text>
  <text class="sm" x="330" y="107" text-anchor="middle">a delegate field</text>
  <line class="wire-accent" x1="414" y1="92" x2="468" y2="92" marker-end="url(#leak-arrow-accent)"/>

  <rect class="box" x="470" y="10" width="210" height="120" rx="8"/>
  <text class="strong" x="575" y="34" text-anchor="middle">EventHandler</text>
  <text class="sm" x="575" y="52" text-anchor="middle">one invocation list entry</text>
  <text class="mono" x="575" y="84" text-anchor="middle">Target = screen</text>
  <text class="mono" x="575" y="106" text-anchor="middle">Method = OnTick</text>
  <line class="wire-accent" x1="575" y1="130" x2="575" y2="168" marker-end="url(#leak-arrow-accent)"/>

  <rect class="solid" x="470" y="170" width="210" height="70" rx="8"/>
  <text class="strong on-solid" x="575" y="198" text-anchor="middle">Screen (subscriber)</text>
  <text class="sm on-solid" x="575" y="218" text-anchor="middle">1 MB buffer, still reachable</text>

  <rect class="zone" x="0" y="170" width="430" height="70" rx="8"/>
  <text class="sm" x="215" y="194" text-anchor="middle">Nothing else references the screen,</text>
  <text class="sm" x="215" y="212" text-anchor="middle">but the clock's delegate still does.</text>
  <text class="mono" x="215" y="230" text-anchor="middle">clock.Tick -= screen.OnTick;</text>
</svg>
