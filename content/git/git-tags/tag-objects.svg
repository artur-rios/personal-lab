<svg xmlns="http://www.w3.org/2000/svg" style="white-space: pre" viewBox="0 0 680 300" role="img" aria-labelledby="tags-title">
  <title id="tags-title">Lightweight and annotated tags. The lightweight tag refs/tags/v1.0.0-lw is only a reference, and it points straight at commit f9d0f72. The annotated tag refs/tags/v1.0.0 points at a tag object, f09f2bf, which records the object it tags, its type, the tag name, the tagger with a date, and a message, and which in turn points at the same commit f9d0f72.</title>
  <defs>
    <marker id="tags-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="tags-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="40" y="10" width="220" height="60" rx="8"/>
  <text class="mono strong" x="150" y="36" text-anchor="middle">refs/tags/v1.0.0-lw</text>
  <text class="sm" x="150" y="56" text-anchor="middle">lightweight: a ref, nothing else</text>

  <rect class="box" x="420" y="10" width="220" height="60" rx="8"/>
  <text class="mono strong" x="530" y="36" text-anchor="middle">refs/tags/v1.0.0</text>
  <text class="sm" x="530" y="56" text-anchor="middle">annotated: a ref to a tag object</text>

  <rect class="box-accent" x="400" y="98" width="260" height="114" rx="8"/>
  <text class="strong" x="530" y="122" text-anchor="middle">tag object f09f2bf</text>
  <text class="mono" x="416" y="146">object f9d0f72…</text>
  <text class="mono" x="416" y="164">type commit   tag v1.0.0</text>
  <text class="mono" x="416" y="182">tagger Artur Rios, date</text>
  <text class="mono" x="416" y="200">Release 1.0.0</text>

  <rect class="solid" x="230" y="240" width="220" height="54" rx="8"/>
  <text class="strong on-solid" x="340" y="263" text-anchor="middle">commit f9d0f72</text>
  <text class="sm on-solid" x="340" y="282" text-anchor="middle">First feature</text>

  <path class="wire" d="M150 70 V267 H228" marker-end="url(#tags-arrow)"/>
  <line class="wire-accent" x1="530" y1="70" x2="530" y2="96" marker-end="url(#tags-arrow-accent)"/>
  <path class="wire-accent" d="M530 212 V267 H452" marker-end="url(#tags-arrow-accent)"/>
</svg>
