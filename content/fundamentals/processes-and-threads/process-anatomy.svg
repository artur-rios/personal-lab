<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="anat-title">
  <title id="anat-title">A process with three threads. The code, global data, heap and resources such as open files belong to the process and are shared by all its threads. Each thread has its own registers and program counter, its own stack and its own thread-local storage.</title>

  <rect class="box-accent" x="0" y="0" width="680" height="316" rx="10"/>
  <text class="strong" x="16" y="26">Process</text>
  <text class="sm" x="80" y="26">one address space, one set of resources</text>

  <text class="sm" x="16" y="50">Shared by every thread</text>
  <rect class="box" x="16" y="58" width="155" height="64" rx="6"/>
  <text x="32" y="84">Code</text>
  <text class="sm" x="32" y="104">machine instructions</text>
  <rect class="box" x="181" y="58" width="155" height="64" rx="6"/>
  <text x="197" y="84">Data</text>
  <text class="sm" x="197" y="104">global variables</text>
  <rect class="box" x="346" y="58" width="155" height="64" rx="6"/>
  <text x="362" y="84">Heap</text>
  <text class="sm" x="362" y="104">malloc, new</text>
  <rect class="box" x="511" y="58" width="155" height="64" rx="6"/>
  <text x="527" y="84">Resources</text>
  <text class="sm" x="527" y="104">files, sockets, PID, user</text>

  <text class="sm" x="16" y="148">Private to each thread</text>

  <rect class="box" x="16" y="156" width="208" height="148" rx="8"/>
  <text class="strong" x="28" y="178">Thread 1</text>
  <rect class="box-accent" x="28" y="188" width="184" height="30" rx="4"/>
  <text x="40" y="208">Registers, PC</text>
  <rect class="box-accent" x="28" y="226" width="184" height="40" rx="4"/>
  <text x="40" y="251">Stack</text>
  <rect class="box-accent" x="28" y="274" width="184" height="22" rx="4"/>
  <text class="sm" x="40" y="290">thread-local storage</text>

  <rect class="box" x="237" y="156" width="208" height="148" rx="8"/>
  <text class="strong" x="249" y="178">Thread 2</text>
  <rect class="box-accent" x="249" y="188" width="184" height="30" rx="4"/>
  <text x="261" y="208">Registers, PC</text>
  <rect class="box-accent" x="249" y="226" width="184" height="40" rx="4"/>
  <text x="261" y="251">Stack</text>
  <rect class="box-accent" x="249" y="274" width="184" height="22" rx="4"/>
  <text class="sm" x="261" y="290">thread-local storage</text>

  <rect class="box" x="458" y="156" width="208" height="148" rx="8"/>
  <text class="strong" x="470" y="178">Thread 3</text>
  <rect class="box-accent" x="470" y="188" width="184" height="30" rx="4"/>
  <text x="482" y="208">Registers, PC</text>
  <rect class="box-accent" x="470" y="226" width="184" height="40" rx="4"/>
  <text x="482" y="251">Stack</text>
  <rect class="box-accent" x="470" y="274" width="184" height="22" rx="4"/>
  <text class="sm" x="482" y="290">thread-local storage</text>
</svg>
