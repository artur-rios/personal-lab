<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-labelledby="pipe-title">
  <title id="pipe-title">Five instructions flowing through a five-stage pipeline over nine clock cycles. Each instruction starts one cycle after the one before it, so from cycle 5 every stage is busy with a different instruction and one instruction completes every cycle.</title>

  <text class="sm" x="0" y="22">Clock cycle →</text>
  <text class="sm" x="170" y="22" text-anchor="middle">1</text>
  <text class="sm" x="230" y="22" text-anchor="middle">2</text>
  <text class="sm" x="290" y="22" text-anchor="middle">3</text>
  <text class="sm" x="350" y="22" text-anchor="middle">4</text>
  <text class="sm accent" x="410" y="22" text-anchor="middle">5</text>
  <text class="sm" x="470" y="22" text-anchor="middle">6</text>
  <text class="sm" x="530" y="22" text-anchor="middle">7</text>
  <text class="sm" x="590" y="22" text-anchor="middle">8</text>
  <text class="sm" x="650" y="22" text-anchor="middle">9</text>

  <text x="0" y="57">Instruction 1</text>
  <rect class="box" x="143" y="36" width="54" height="32" rx="4"/><text x="170" y="57" text-anchor="middle">IF</text>
  <rect class="box" x="203" y="36" width="54" height="32" rx="4"/><text x="230" y="57" text-anchor="middle">ID</text>
  <rect class="box" x="263" y="36" width="54" height="32" rx="4"/><text x="290" y="57" text-anchor="middle">EX</text>
  <rect class="box" x="323" y="36" width="54" height="32" rx="4"/><text x="350" y="57" text-anchor="middle">MEM</text>
  <rect class="box-accent" x="383" y="36" width="54" height="32" rx="4"/><text x="410" y="57" text-anchor="middle">WB</text>

  <text x="0" y="95">Instruction 2</text>
  <rect class="box" x="203" y="74" width="54" height="32" rx="4"/><text x="230" y="95" text-anchor="middle">IF</text>
  <rect class="box" x="263" y="74" width="54" height="32" rx="4"/><text x="290" y="95" text-anchor="middle">ID</text>
  <rect class="box" x="323" y="74" width="54" height="32" rx="4"/><text x="350" y="95" text-anchor="middle">EX</text>
  <rect class="box-accent" x="383" y="74" width="54" height="32" rx="4"/><text x="410" y="95" text-anchor="middle">MEM</text>
  <rect class="box" x="443" y="74" width="54" height="32" rx="4"/><text x="470" y="95" text-anchor="middle">WB</text>

  <text x="0" y="133">Instruction 3</text>
  <rect class="box" x="263" y="112" width="54" height="32" rx="4"/><text x="290" y="133" text-anchor="middle">IF</text>
  <rect class="box" x="323" y="112" width="54" height="32" rx="4"/><text x="350" y="133" text-anchor="middle">ID</text>
  <rect class="box-accent" x="383" y="112" width="54" height="32" rx="4"/><text x="410" y="133" text-anchor="middle">EX</text>
  <rect class="box" x="443" y="112" width="54" height="32" rx="4"/><text x="470" y="133" text-anchor="middle">MEM</text>
  <rect class="box" x="503" y="112" width="54" height="32" rx="4"/><text x="530" y="133" text-anchor="middle">WB</text>

  <text x="0" y="171">Instruction 4</text>
  <rect class="box" x="323" y="150" width="54" height="32" rx="4"/><text x="350" y="171" text-anchor="middle">IF</text>
  <rect class="box-accent" x="383" y="150" width="54" height="32" rx="4"/><text x="410" y="171" text-anchor="middle">ID</text>
  <rect class="box" x="443" y="150" width="54" height="32" rx="4"/><text x="470" y="171" text-anchor="middle">EX</text>
  <rect class="box" x="503" y="150" width="54" height="32" rx="4"/><text x="530" y="171" text-anchor="middle">MEM</text>
  <rect class="box" x="563" y="150" width="54" height="32" rx="4"/><text x="590" y="171" text-anchor="middle">WB</text>

  <text x="0" y="209">Instruction 5</text>
  <rect class="box-accent" x="383" y="188" width="54" height="32" rx="4"/><text x="410" y="209" text-anchor="middle">IF</text>
  <rect class="box" x="443" y="188" width="54" height="32" rx="4"/><text x="470" y="209" text-anchor="middle">ID</text>
  <rect class="box" x="503" y="188" width="54" height="32" rx="4"/><text x="530" y="209" text-anchor="middle">EX</text>
  <rect class="box" x="563" y="188" width="54" height="32" rx="4"/><text x="590" y="209" text-anchor="middle">MEM</text>
  <rect class="box" x="623" y="188" width="54" height="32" rx="4"/><text x="650" y="209" text-anchor="middle">WB</text>
</svg>
