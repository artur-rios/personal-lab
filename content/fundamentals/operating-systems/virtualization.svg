<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="virt-title">
  <title id="virt-title">Three ways to run isolated workloads on one machine. A type 1 hypervisor runs directly on the hardware and hosts virtual machines, each with its own guest kernel. A type 2 hypervisor runs on a host operating system. Containers share the host kernel, which isolates them with namespaces and control groups.</title>

  <!-- Type 1 -->
  <text class="strong" x="105" y="20" text-anchor="middle">Type 1 hypervisor</text>
  <text class="sm" x="105" y="38" text-anchor="middle">Xen, Hyper-V, VMware ESXi</text>
  <rect class="box" x="0" y="56" width="100" height="140" rx="8"/>
  <text class="sm" x="50" y="74" text-anchor="middle">VM</text>
  <rect class="box" x="8" y="84" width="84" height="44" rx="6"/>
  <text x="50" y="111" text-anchor="middle">Apps</text>
  <rect class="box-accent" x="8" y="138" width="84" height="48" rx="6"/>
  <text x="50" y="167" text-anchor="middle">Guest OS</text>
  <rect class="box" x="110" y="56" width="100" height="140" rx="8"/>
  <text class="sm" x="160" y="74" text-anchor="middle">VM</text>
  <rect class="box" x="118" y="84" width="84" height="44" rx="6"/>
  <text x="160" y="111" text-anchor="middle">Apps</text>
  <rect class="box-accent" x="118" y="138" width="84" height="48" rx="6"/>
  <text x="160" y="167" text-anchor="middle">Guest OS</text>
  <rect class="solid" x="0" y="208" width="210" height="96" rx="8"/>
  <text class="strong on-solid" x="105" y="250" text-anchor="middle">Hypervisor</text>
  <text class="sm on-solid" x="105" y="270" text-anchor="middle">runs on the bare hardware</text>

  <!-- Type 2 -->
  <text class="strong" x="340" y="20" text-anchor="middle">Type 2 hypervisor</text>
  <text class="sm" x="340" y="38" text-anchor="middle">VirtualBox, VMware Workstation</text>
  <rect class="box" x="235" y="56" width="100" height="140" rx="8"/>
  <text class="sm" x="285" y="74" text-anchor="middle">VM</text>
  <rect class="box" x="243" y="84" width="84" height="44" rx="6"/>
  <text x="285" y="111" text-anchor="middle">Apps</text>
  <rect class="box-accent" x="243" y="138" width="84" height="48" rx="6"/>
  <text x="285" y="167" text-anchor="middle">Guest OS</text>
  <rect class="box" x="345" y="56" width="100" height="140" rx="8"/>
  <text class="sm" x="395" y="74" text-anchor="middle">Host apps</text>
  <text x="395" y="130" text-anchor="middle">Browser,</text>
  <text x="395" y="148" text-anchor="middle">editor, …</text>
  <rect class="solid" x="235" y="208" width="210" height="42" rx="8"/>
  <text class="strong on-solid" x="340" y="234" text-anchor="middle">Hypervisor</text>
  <rect class="box-accent" x="235" y="262" width="210" height="42" rx="8"/>
  <text x="340" y="288" text-anchor="middle">Host OS kernel</text>

  <!-- Containers -->
  <text class="strong" x="575" y="20" text-anchor="middle">Containers</text>
  <text class="sm" x="575" y="38" text-anchor="middle">Docker, Podman, LXC</text>
  <rect class="box" x="470" y="56" width="63" height="140" rx="8"/>
  <text x="501.5" y="118" text-anchor="middle">App</text>
  <text class="sm" x="501.5" y="138" text-anchor="middle">+ libs</text>
  <rect class="box" x="543.5" y="56" width="63" height="140" rx="8"/>
  <text x="575" y="118" text-anchor="middle">App</text>
  <text class="sm" x="575" y="138" text-anchor="middle">+ libs</text>
  <rect class="box" x="617" y="56" width="63" height="140" rx="8"/>
  <text x="648.5" y="118" text-anchor="middle">App</text>
  <text class="sm" x="648.5" y="138" text-anchor="middle">+ libs</text>
  <rect class="box" x="470" y="208" width="210" height="42" rx="8"/>
  <text x="575" y="234" text-anchor="middle">Container runtime</text>
  <rect class="box-accent" x="470" y="262" width="210" height="42" rx="8"/>
  <text x="575" y="280" text-anchor="middle">Shared host kernel</text>
  <text class="sm" x="575" y="296" text-anchor="middle">namespaces · cgroups</text>

  <!-- Hardware -->
  <rect class="box" x="0" y="318" width="680" height="34" rx="8"/>
  <text x="340" y="340" text-anchor="middle">Hardware</text>
</svg>
