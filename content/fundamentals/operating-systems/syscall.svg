<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" role="img" aria-labelledby="syscall-title">
  <title id="syscall-title">The six steps of a write system call on x86-64 Linux: the program calls write, the C library wrapper loads registers and executes the syscall instruction, the CPU switches to kernel mode, the kernel dispatches through its system call table, the handler does the work, and sysret returns the result to the program.</title>
  <defs>
    <marker id="syscall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="syscall-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="sm" x="0" y="20">User mode</text>
  <text class="sm" x="0" y="200">Kernel mode</text>
  <line class="zone" x1="0" y1="176" x2="680" y2="176"/>
  <text class="sm accent" x="392" y="170">trap: the CPU switches to kernel mode</text>

  <!-- 1 -->
  <circle class="solid" cx="116" cy="46" r="13"/>
  <text class="strong on-solid" x="116" y="51" text-anchor="middle">1</text>
  <rect class="box" x="140" y="20" width="480" height="52" rx="8"/>
  <text x="156" y="42">Your program calls <tspan class="mono">write(1, buf, 3)</tspan></text>
  <text class="sm" x="156" y="60">An ordinary function call into the C library.</text>
  <line class="wire" x1="380" y1="72" x2="380" y2="98" marker-end="url(#syscall-arrow)"/>

  <!-- 2 -->
  <circle class="solid" cx="116" cy="126" r="13"/>
  <text class="strong on-solid" x="116" y="131" text-anchor="middle">2</text>
  <rect class="box" x="140" y="100" width="480" height="52" rx="8"/>
  <text x="156" y="122">The C library wrapper prepares the call</text>
  <text class="sm" x="156" y="140">Number 1 in rax, arguments in rdi, rsi, rdx, then the syscall instruction.</text>
  <line class="wire-accent" x1="380" y1="152" x2="380" y2="198" marker-end="url(#syscall-arrow-accent)"/>

  <!-- 3 -->
  <circle class="solid" cx="116" cy="226" r="13"/>
  <text class="strong on-solid" x="116" y="231" text-anchor="middle">3</text>
  <rect class="box-accent" x="140" y="200" width="480" height="52" rx="8"/>
  <text x="156" y="222">Kernel entry code takes over</text>
  <text class="sm" x="156" y="240">Saves the user registers and switches to the kernel stack.</text>
  <line class="wire" x1="380" y1="252" x2="380" y2="278" marker-end="url(#syscall-arrow)"/>

  <!-- 4 -->
  <circle class="solid" cx="116" cy="306" r="13"/>
  <text class="strong on-solid" x="116" y="311" text-anchor="middle">4</text>
  <rect class="box-accent" x="140" y="280" width="480" height="52" rx="8"/>
  <text x="156" y="302">Dispatch through the system call table</text>
  <text class="sm" x="156" y="320">Entry 1 of the table points at the kernel's write handler.</text>
  <line class="wire" x1="380" y1="332" x2="380" y2="358" marker-end="url(#syscall-arrow)"/>

  <!-- 5 -->
  <circle class="solid" cx="116" cy="386" r="13"/>
  <text class="strong on-solid" x="116" y="391" text-anchor="middle">5</text>
  <rect class="box-accent" x="140" y="360" width="480" height="52" rx="8"/>
  <text x="156" y="382">The handler does the work</text>
  <text class="sm" x="156" y="400">Checks the file descriptor and buffer, copies the bytes, queues the I/O.</text>
  <line class="wire" x1="380" y1="412" x2="380" y2="438" marker-end="url(#syscall-arrow)"/>

  <!-- 6 -->
  <circle class="solid" cx="116" cy="466" r="13"/>
  <text class="strong on-solid" x="116" y="471" text-anchor="middle">6</text>
  <rect class="box-accent" x="140" y="440" width="480" height="52" rx="8"/>
  <text x="156" y="462">Return to user mode</text>
  <text class="sm" x="156" y="480">Result in rax, registers restored, sysret resumes the program.</text>

  <!-- Return path -->
  <path class="wire-accent" d="M620 466 H652 V46 H622" marker-end="url(#syscall-arrow-accent)"/>
  <text class="sm accent" x="670" y="320" text-anchor="middle" transform="rotate(-90 670 320)">returns 3, the bytes written</text>
</svg>
