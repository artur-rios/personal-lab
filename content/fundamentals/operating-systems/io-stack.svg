<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" role="img" aria-labelledby="io-title">
  <title id="io-title">The path of a read call through the Linux storage stack: the application calls read, the system call layer hands it to the virtual file system, the file system maps the file to blocks, the page cache returns the data if it is already in memory, otherwise the block layer queues a request, the device driver programs the controller, and the disk controller transfers the data by DMA and raises an interrupt.</title>
  <defs>
    <marker id="io-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="sm" x="0" y="45">User</text>
  <line class="zone" x1="0" y1="80" x2="680" y2="80"/>
  <text class="sm" x="0" y="125">Kernel</text>
  <line class="zone" x1="0" y1="460" x2="680" y2="460"/>
  <text class="sm" x="0" y="505">Hardware</text>

  <rect class="box" x="130" y="20" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="45">Application</text>
  <text class="mono" x="644" y="44" text-anchor="end">read(fd, buf, 4096)</text>
  <line class="wire" x1="170" y1="60" x2="170" y2="98" marker-end="url(#io-arrow)"/>

  <rect class="box-accent" x="130" y="100" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="125">System call layer</text>
  <text class="sm" x="644" y="124" text-anchor="end">finds the open file behind the descriptor</text>
  <line class="wire" x1="170" y1="140" x2="170" y2="158" marker-end="url(#io-arrow)"/>

  <rect class="box-accent" x="130" y="160" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="185">Virtual file system</text>
  <text class="sm" x="644" y="184" text-anchor="end">one interface in front of every file system</text>
  <line class="wire" x1="170" y1="200" x2="170" y2="218" marker-end="url(#io-arrow)"/>

  <rect class="box-accent" x="130" y="220" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="245">File system</text>
  <text class="sm" x="644" y="244" text-anchor="end">ext4, NTFS, APFS: maps file offsets to disk blocks</text>
  <line class="wire" x1="170" y1="260" x2="170" y2="278" marker-end="url(#io-arrow)"/>

  <rect class="solid" x="130" y="280" width="530" height="40" rx="8"/>
  <text class="strong on-solid" x="146" y="305">Page cache</text>
  <text class="sm on-solid" x="644" y="305" text-anchor="end">already in memory? copy it and return</text>
  <line class="wire" x1="170" y1="320" x2="170" y2="338" marker-end="url(#io-arrow)"/>

  <rect class="box-accent" x="130" y="340" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="365">Block layer</text>
  <text class="sm" x="644" y="364" text-anchor="end">queues, merges and orders requests</text>
  <line class="wire" x1="170" y1="380" x2="170" y2="398" marker-end="url(#io-arrow)"/>

  <rect class="box-accent" x="130" y="400" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="425">Device driver</text>
  <text class="sm" x="644" y="424" text-anchor="end">NVMe, SATA: programs the controller</text>
  <line class="wire" x1="170" y1="440" x2="170" y2="478" marker-end="url(#io-arrow)"/>

  <rect class="box" x="130" y="480" width="530" height="40" rx="8"/>
  <text class="strong" x="146" y="505">Storage controller</text>
  <text class="sm" x="644" y="504" text-anchor="end">copies data by DMA, then raises an interrupt</text>
</svg>
