<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" role="img" aria-labelledby="boot-title">
  <title id="boot-title">The boot sequence: firmware checks the hardware and finds a boot device, the boot loader loads the kernel, the kernel initialises itself and starts the first user-mode process, which starts the system services, and finally a login prompt starts the user's session.</title>
  <defs>
    <marker id="boot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Row 1: before user space -->
  <rect class="box" x="0" y="10" width="190" height="76" rx="8"/>
  <text class="strong" x="16" y="34">1 · Firmware</text>
  <text class="sm" x="16" y="54">UEFI or legacy BIOS</text>
  <text class="sm" x="16" y="72">checks hardware, finds a disk</text>
  <line class="wire" x1="190" y1="48" x2="243" y2="48" marker-end="url(#boot-arrow)"/>

  <rect class="box" x="245" y="10" width="190" height="76" rx="8"/>
  <text class="strong" x="261" y="34">2 · Boot loader</text>
  <text class="sm" x="261" y="54">GRUB, Windows Boot Manager</text>
  <text class="sm" x="261" y="72">loads the kernel into memory</text>
  <line class="wire" x1="435" y1="48" x2="488" y2="48" marker-end="url(#boot-arrow)"/>

  <rect class="box-accent" x="490" y="10" width="190" height="76" rx="8"/>
  <text class="strong" x="506" y="34">3 · Kernel</text>
  <text class="sm" x="506" y="54">sets up memory, interrupts</text>
  <text class="sm" x="506" y="72">starts drivers, mounts root</text>

  <path class="wire" d="M585 86 V108 H95 V128" marker-end="url(#boot-arrow)"/>

  <!-- Row 2: user space -->
  <rect class="box" x="0" y="130" width="190" height="76" rx="8"/>
  <text class="strong" x="16" y="154">4 · First process</text>
  <text class="sm" x="16" y="174">systemd, launchd, smss.exe</text>
  <text class="sm" x="16" y="192">the first user-mode process</text>
  <line class="wire" x1="190" y1="168" x2="243" y2="168" marker-end="url(#boot-arrow)"/>

  <rect class="box" x="245" y="130" width="190" height="76" rx="8"/>
  <text class="strong" x="261" y="154">5 · System services</text>
  <text class="sm" x="261" y="174">logging, network, devices</text>
  <text class="sm" x="261" y="192">started in dependency order</text>
  <line class="wire" x1="435" y1="168" x2="488" y2="168" marker-end="url(#boot-arrow)"/>

  <rect class="box" x="490" y="130" width="190" height="76" rx="8"/>
  <text class="strong" x="506" y="154">6 · Login</text>
  <text class="sm" x="506" y="174">graphical or text prompt</text>
  <text class="sm" x="506" y="192">your session and shell begin</text>
</svg>
