<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="cs-title">
  <title id="cs-title">The Unicode code space. It is divided into 17 planes of 65,536 code points each, from U+0000 to U+10FFFF. Plane 0, the Basic Multilingual Plane, holds the characters of almost all modern scripts. Plane 1, the Supplementary Multilingual Plane, holds historic scripts, symbols and most emoji. Planes 2 and 3 hold additional CJK ideographs. Planes 4 to 13 are unassigned, plane 14 holds special-purpose characters, and planes 15 and 16 are for private use. Within the Basic Multilingual Plane, the range D800 to DFFF is reserved for UTF-16 surrogates and E000 to F8FF is a private use area.</title>

  <text class="sm" x="0" y="16">17 planes × 65,536 code points = 1,114,112 code points, U+0000 to U+10FFFF</text>
  <g>
    <rect class="solid" x="0" y="26" width="40" height="44"/>
    <rect class="box-accent" x="40" y="26" width="40" height="44"/>
    <rect class="box-accent" x="80" y="26" width="40" height="44"/>
    <rect class="box-accent" x="120" y="26" width="40" height="44"/>
    <rect class="box" x="160" y="26" width="400" height="44"/>
    <rect class="box-accent" x="560" y="26" width="40" height="44"/>
    <rect class="box" x="600" y="26" width="40" height="44"/>
    <rect class="box" x="640" y="26" width="40" height="44"/>
  </g>
  <text class="strong on-solid" x="20" y="53" text-anchor="middle">0</text>
  <text x="60" y="53" text-anchor="middle">1</text>
  <text x="100" y="53" text-anchor="middle">2</text>
  <text x="140" y="53" text-anchor="middle">3</text>
  <text class="sm" x="360" y="53" text-anchor="middle">planes 4–13: unassigned</text>
  <text x="580" y="53" text-anchor="middle">14</text>
  <text x="620" y="53" text-anchor="middle">15</text>
  <text x="660" y="53" text-anchor="middle">16</text>

  <text class="sm" x="6" y="90">0: Basic Multilingual Plane</text>
  <text class="sm" x="6" y="106">1: historic scripts, symbols, emoji</text>
  <text class="sm" x="230" y="90">2–3: more CJK ideographs (and Seal script)</text>
  <text class="sm" x="680" y="90" text-anchor="end">14: special purpose</text>
  <text class="sm" x="680" y="106" text-anchor="end">15–16: private use</text>


  <text class="sm" x="6" y="146">Plane 0 in detail, U+0000 to U+FFFF</text>
  <rect class="box-accent" x="0" y="152" width="574" height="50"/>
  <rect class="solid" x="574" y="152" width="21" height="50"/>
  <rect class="box" x="595" y="152" width="67" height="50"/>
  <rect class="box-accent" x="662" y="152" width="18" height="50"/>
  <text x="287" y="182" text-anchor="middle">most modern scripts, symbols and CJK</text>
  <text class="mono" x="0" y="220">0000</text>
  <text class="mono" x="680" y="220" text-anchor="end">FFFF</text>
  <line class="wire-accent" x1="584" y1="202" x2="584" y2="240"/>
  <text class="sm accent" x="576" y="244" text-anchor="end">D800–DFFF: surrogates, reserved for UTF-16</text>
  <line class="wire" x1="628" y1="202" x2="628" y2="256"/>
  <text class="sm" x="620" y="262" text-anchor="end">E000–F8FF: private use</text>
</svg>
