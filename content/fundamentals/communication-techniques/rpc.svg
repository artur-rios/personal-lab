<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" role="img" aria-labelledby="rpc-title">
  <title id="rpc-title">The structure of a remote procedure call, after Birrell and Nelson. On the client machine, the caller makes what looks like an ordinary call, add of 2 and 3. The client stub marshals the procedure name and arguments into a message, and the RPC runtime sends it as a call packet across the network, retransmitting if needed. On the server machine, the RPC runtime receives the packet and hands it to the server stub, which unmarshals the arguments and calls the real procedure. The result travels back the same way in a result packet, and the client stub returns it to the caller as if the call had been local.</title>
  <defs>
    <marker id="rpc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="rpc-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head-accent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="zone" x="0" y="0" width="250" height="262" rx="8"/>
  <text class="sm" x="14" y="22">client machine</text>
  <rect class="zone" x="430" y="0" width="250" height="262" rx="8"/>
  <text class="sm" x="444" y="22">server machine</text>

  <!-- Client side -->
  <rect class="box-accent" x="20" y="36" width="210" height="52" rx="6"/>
  <text class="strong" x="34" y="58">Caller</text>
  <text class="mono" x="34" y="77">result = add(2, 3)</text>
  <rect class="box" x="20" y="116" width="210" height="52" rx="6"/>
  <text class="strong" x="34" y="138">Client stub</text>
  <text class="sm" x="34" y="157">marshal name and arguments</text>
  <rect class="box" x="20" y="196" width="210" height="52" rx="6"/>
  <text class="strong" x="34" y="218">RPC runtime</text>
  <text class="sm" x="34" y="237">send, wait, retransmit</text>
  <line class="wire" x1="110" y1="88" x2="110" y2="114" marker-end="url(#rpc-arrow)"/>
  <line class="wire" x1="110" y1="168" x2="110" y2="194" marker-end="url(#rpc-arrow)"/>
  <line class="wire" x1="150" y1="194" x2="150" y2="170" marker-end="url(#rpc-arrow)"/>
  <line class="wire" x1="150" y1="114" x2="150" y2="90" marker-end="url(#rpc-arrow)"/>

  <!-- Server side -->
  <rect class="box-accent" x="450" y="36" width="210" height="52" rx="6"/>
  <text class="strong" x="464" y="58">Procedure</text>
  <text class="mono" x="464" y="77">def add(a, b)</text>
  <rect class="box" x="450" y="116" width="210" height="52" rx="6"/>
  <text class="strong" x="464" y="138">Server stub</text>
  <text class="sm" x="464" y="157">unmarshal, call, marshal result</text>
  <rect class="box" x="450" y="196" width="210" height="52" rx="6"/>
  <text class="strong" x="464" y="218">RPC runtime</text>
  <text class="sm" x="464" y="237">receive, dispatch, reply</text>
  <line class="wire" x1="530" y1="194" x2="530" y2="170" marker-end="url(#rpc-arrow)"/>
  <line class="wire" x1="530" y1="114" x2="530" y2="90" marker-end="url(#rpc-arrow)"/>
  <line class="wire" x1="570" y1="90" x2="570" y2="114" marker-end="url(#rpc-arrow)"/>
  <line class="wire" x1="570" y1="170" x2="570" y2="194" marker-end="url(#rpc-arrow)"/>

  <!-- Network -->
  <line class="wire-accent" x1="230" y1="210" x2="448" y2="210" marker-end="url(#rpc-arrow-accent)"/>
  <text class="mono" x="340" y="203" text-anchor="middle">call packet</text>
  <line class="wire-accent" x1="450" y1="236" x2="232" y2="236" marker-end="url(#rpc-arrow-accent)"/>
  <text class="mono" x="340" y="254" text-anchor="middle">result packet</text>
  <text class="sm" x="340" y="120" text-anchor="middle">network</text>
  <text class="sm" x="340" y="138" text-anchor="middle">latency, loss,</text>
  <text class="sm" x="340" y="156" text-anchor="middle">partial failure</text>
</svg>
