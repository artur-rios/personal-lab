<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-labelledby="heap-title">
  <title id="heap-title">A binary min-heap drawn as a tree and as the array that actually stores it. The tree has 1 at the root, 3 and 2 below it, and 7, 4, 5 and 6 on the bottom level; every parent is no larger than its children. The array holds the same values level by level: 1, 3, 2, 7, 4, 5, 6. The children of the element at index i are at indexes 2i + 1 and 2i + 2, so the node at index 1 has its children at indexes 3 and 4.</title>

  <text class="sm" x="0" y="16">As a tree</text>
  <line class="wire" x1="165" y1="44" x2="85" y2="110"/>
  <line class="wire" x1="165" y1="44" x2="245" y2="110"/>
  <line class="wire-accent" x1="85" y1="110" x2="45" y2="180"/>
  <line class="wire-accent" x1="85" y1="110" x2="125" y2="180"/>
  <line class="wire" x1="245" y1="110" x2="205" y2="180"/>
  <line class="wire" x1="245" y1="110" x2="285" y2="180"/>
  <circle class="solid" cx="165" cy="44" r="20"/>
  <text class="strong on-solid" x="165" y="49" text-anchor="middle">1</text>
  <circle class="box-accent" cx="85" cy="110" r="20"/>
  <text x="85" y="115" text-anchor="middle">3</text>
  <circle class="box" cx="245" cy="110" r="20"/>
  <text x="245" y="115" text-anchor="middle">2</text>
  <circle class="box" cx="45" cy="180" r="20"/>
  <text x="45" y="185" text-anchor="middle">7</text>
  <circle class="box" cx="125" cy="180" r="20"/>
  <text x="125" y="185" text-anchor="middle">4</text>
  <circle class="box" cx="205" cy="180" r="20"/>
  <text x="205" y="185" text-anchor="middle">5</text>
  <circle class="box" cx="285" cy="180" r="20"/>
  <text x="285" y="185" text-anchor="middle">6</text>
  <text class="sm" x="165" y="226" text-anchor="middle">every parent ≤ its children</text>

  <text class="sm" x="360" y="16">As the array that stores it</text>
  <path class="wire-accent" d="M427 98 Q472 48 517 98"/>
  <path class="wire-accent" d="M427 98 Q495 28 562 98"/>
  <rect class="solid" x="360" y="100" width="45" height="36"/>
  <rect class="box-accent" x="405" y="100" width="45" height="36"/>
  <rect class="box" x="450" y="100" width="45" height="36"/>
  <rect class="box" x="495" y="100" width="45" height="36"/>
  <rect class="box" x="540" y="100" width="45" height="36"/>
  <rect class="box" x="585" y="100" width="45" height="36"/>
  <rect class="box" x="630" y="100" width="45" height="36"/>
  <text class="strong on-solid" x="382" y="123" text-anchor="middle">1</text>
  <text x="427" y="123" text-anchor="middle">3</text>
  <text x="472" y="123" text-anchor="middle">2</text>
  <text x="517" y="123" text-anchor="middle">7</text>
  <text x="562" y="123" text-anchor="middle">4</text>
  <text x="607" y="123" text-anchor="middle">5</text>
  <text x="652" y="123" text-anchor="middle">6</text>
  <text class="mono" x="382" y="154" text-anchor="middle">0</text>
  <text class="mono" x="427" y="154" text-anchor="middle">1</text>
  <text class="mono" x="472" y="154" text-anchor="middle">2</text>
  <text class="mono" x="517" y="154" text-anchor="middle">3</text>
  <text class="mono" x="562" y="154" text-anchor="middle">4</text>
  <text class="mono" x="607" y="154" text-anchor="middle">5</text>
  <text class="mono" x="652" y="154" text-anchor="middle">6</text>
  <text class="sm accent" x="517" y="186" text-anchor="middle">children of index i are at 2i + 1 and 2i + 2</text>
  <text class="sm" x="517" y="206" text-anchor="middle">no pointers needed: the shape is implied</text>
</svg>
