<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 274" role="img" aria-labelledby="avl-title">
  <title id="avl-title">An array and a linked list holding the same values. The array stores 7, 3, 9, 4, 1 and 8 in one contiguous block, so the address of element i is the start address plus i times the element size. The linked list stores 7, 3, 9 and 4 in separate nodes scattered through memory, each holding a value and a pointer to the next node; the last pointer is null.</title>
  <defs>
    <marker id="avl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Array -->
  <text class="sm" x="20" y="16">Array: one contiguous block of memory</text>
  <rect class="box-accent" x="20" y="26" width="90" height="44"/>
  <rect class="box-accent" x="110" y="26" width="90" height="44"/>
  <rect class="box-accent" x="200" y="26" width="90" height="44"/>
  <rect class="box-accent" x="290" y="26" width="90" height="44"/>
  <rect class="box-accent" x="380" y="26" width="90" height="44"/>
  <rect class="box-accent" x="470" y="26" width="90" height="44"/>
  <text x="65" y="53" text-anchor="middle">7</text>
  <text x="155" y="53" text-anchor="middle">3</text>
  <text x="245" y="53" text-anchor="middle">9</text>
  <text x="335" y="53" text-anchor="middle">4</text>
  <text x="425" y="53" text-anchor="middle">1</text>
  <text x="515" y="53" text-anchor="middle">8</text>
  <text class="mono" x="65" y="88" text-anchor="middle">[0]</text>
  <text class="mono" x="155" y="88" text-anchor="middle">[1]</text>
  <text class="mono" x="245" y="88" text-anchor="middle">[2]</text>
  <text class="mono" x="335" y="88" text-anchor="middle">[3]</text>
  <text class="mono" x="425" y="88" text-anchor="middle">[4]</text>
  <text class="mono" x="515" y="88" text-anchor="middle">[5]</text>
  <text class="sm" x="65" y="104" text-anchor="middle">1000</text>
  <text class="sm" x="155" y="104" text-anchor="middle">1008</text>
  <text class="sm" x="245" y="104" text-anchor="middle">1016</text>
  <text class="sm" x="335" y="104" text-anchor="middle">1024</text>
  <text class="sm" x="425" y="104" text-anchor="middle">1032</text>
  <text class="sm" x="515" y="104" text-anchor="middle">1040</text>
  <text class="sm accent" x="20" y="126">address of [i] = start + i × 8: any element in one step</text>

  <!-- Linked list -->
  <text class="sm" x="20" y="152">Linked list: nodes anywhere in memory, joined by pointers</text>
  <text class="sm" x="20" y="198">head</text>
  <line class="wire" x1="50" y1="194" x2="58" y2="194"/>
  <path class="wire" d="M58 194V208" marker-end="url(#avl-arrow)"/>

  <rect class="box-accent" x="40" y="210" width="44" height="34"/>
  <rect class="box" x="84" y="210" width="30" height="34"/>
  <text x="62" y="232" text-anchor="middle">7</text>
  <circle class="solid" cx="99" cy="227" r="3"/>
  <path class="wire" d="M99 227H160V190H198" marker-end="url(#avl-arrow)"/>

  <rect class="box-accent" x="200" y="174" width="44" height="34"/>
  <rect class="box" x="244" y="174" width="30" height="34"/>
  <text x="222" y="196" text-anchor="middle">3</text>
  <circle class="solid" cx="259" cy="191" r="3"/>
  <path class="wire" d="M259 191H310V234H368" marker-end="url(#avl-arrow)"/>

  <rect class="box-accent" x="370" y="217" width="44" height="34"/>
  <rect class="box" x="414" y="217" width="30" height="34"/>
  <text x="392" y="239" text-anchor="middle">9</text>
  <circle class="solid" cx="429" cy="234" r="3"/>
  <path class="wire" d="M429 234H480V192H528" marker-end="url(#avl-arrow)"/>

  <rect class="box-accent" x="530" y="175" width="44" height="34"/>
  <rect class="box" x="574" y="175" width="30" height="34"/>
  <text x="552" y="197" text-anchor="middle">4</text>
  <text class="sm" x="589" y="196" text-anchor="middle">∅</text>
  <text class="sm accent" x="530" y="234">reaching the k-th</text>
  <text class="sm accent" x="530" y="250">node takes k steps</text>
</svg>
