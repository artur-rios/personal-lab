<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="dt-title">
  <title id="dt-title">A small HTML document and the DOM tree the parser builds from it. The Document node has one child, the html element, which has two children, head and body. Head contains a title element with the text Shopping. Body contains an h1 element with the text List, and a ul element with two li elements containing the texts Milk and Eggs. Element nodes and text nodes are drawn differently.</title>

  <!-- Source -->
  <text class="sm" x="0" y="16">HTML source</text>
  <rect class="box" x="0" y="24" width="230" height="200" rx="6"/>
  <text class="mono" x="12" y="48">&lt;!DOCTYPE html&gt;</text>
  <text class="mono" x="12" y="68">&lt;html&gt;</text>
  <text class="mono" x="26" y="88">&lt;head&gt;</text>
  <text class="mono" x="40" y="108">&lt;title&gt;Shopping&lt;/title&gt;</text>
  <text class="mono" x="26" y="128">&lt;/head&gt;</text>
  <text class="mono" x="26" y="148">&lt;body&gt;</text>
  <text class="mono" x="40" y="168">&lt;h1&gt;List&lt;/h1&gt;</text>
  <text class="mono" x="40" y="188">&lt;ul&gt;&lt;li&gt;Milk&lt;li&gt;Eggs&lt;/ul&gt;</text>
  <text class="mono" x="12" y="208">&lt;/body&gt;&lt;/html&gt;</text>

  <!-- Tree edges -->
  <text class="sm" x="260" y="16">DOM tree</text>
  <line class="wire" x1="440" y1="46" x2="440" y2="70"/>
  <line class="wire" x1="440" y1="92" x2="340" y2="118"/>
  <line class="wire" x1="440" y1="92" x2="540" y2="118"/>
  <line class="wire" x1="340" y1="140" x2="300" y2="166"/>
  <line class="wire" x1="540" y1="140" x2="480" y2="166"/>
  <line class="wire" x1="540" y1="140" x2="610" y2="166"/>
  <line class="wire" x1="300" y1="188" x2="300" y2="214"/>
  <line class="wire" x1="480" y1="188" x2="480" y2="214"/>
  <line class="wire" x1="610" y1="188" x2="570" y2="226"/>
  <line class="wire" x1="610" y1="188" x2="650" y2="226"/>
  <line class="wire" x1="570" y1="248" x2="570" y2="266"/>
  <line class="wire" x1="650" y1="248" x2="650" y2="266"/>

  <!-- Nodes -->
  <rect class="solid" x="395" y="24" width="90" height="22" rx="11"/>
  <text class="sm on-solid" x="440" y="39" text-anchor="middle">Document</text>
  <rect class="box-accent" x="410" y="70" width="60" height="22" rx="4"/>
  <text class="mono" x="440" y="85" text-anchor="middle">html</text>
  <rect class="box-accent" x="310" y="118" width="60" height="22" rx="4"/>
  <text class="mono" x="340" y="133" text-anchor="middle">head</text>
  <rect class="box-accent" x="510" y="118" width="60" height="22" rx="4"/>
  <text class="mono" x="540" y="133" text-anchor="middle">body</text>
  <rect class="box-accent" x="270" y="166" width="60" height="22" rx="4"/>
  <text class="mono" x="300" y="181" text-anchor="middle">title</text>
  <rect class="box-accent" x="450" y="166" width="60" height="22" rx="4"/>
  <text class="mono" x="480" y="181" text-anchor="middle">h1</text>
  <rect class="box-accent" x="580" y="166" width="60" height="22" rx="4"/>
  <text class="mono" x="610" y="181" text-anchor="middle">ul</text>
  <rect class="box" x="258" y="214" width="84" height="22" rx="11"/>
  <text class="sm" x="300" y="229" text-anchor="middle">"Shopping"</text>
  <rect class="box" x="450" y="214" width="60" height="22" rx="11"/>
  <text class="sm" x="480" y="229" text-anchor="middle">"List"</text>
  <rect class="box-accent" x="545" y="226" width="50" height="22" rx="4"/>
  <text class="mono" x="570" y="241" text-anchor="middle">li</text>
  <rect class="box-accent" x="625" y="226" width="50" height="22" rx="4"/>
  <text class="mono" x="650" y="241" text-anchor="middle">li</text>
  <rect class="box" x="540" y="266" width="60" height="22" rx="11"/>
  <text class="sm" x="570" y="281" text-anchor="middle">"Milk"</text>
  <rect class="box" x="620" y="266" width="60" height="22" rx="11"/>
  <text class="sm" x="650" y="281" text-anchor="middle">"Eggs"</text>

  <rect class="box-accent" x="0" y="246" width="20" height="14" rx="3"/>
  <text class="sm" x="28" y="257">element node</text>
  <rect class="box" x="0" y="270" width="20" height="14" rx="7"/>
  <text class="sm" x="28" y="281">text node</text>
  <text class="sm" x="120" y="257">The parser closes</text>
  <text class="sm" x="120" y="273">the first &lt;li&gt; itself</text>
</svg>
