<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" role="img" aria-labelledby="nv-title">
  <title id="nv-title">The steps from typing a URL to the first pixels. The browser parses the URL, looks up the host name in DNS, opens a connection with TCP and TLS or with QUIC, sends an HTTP request and receives the response, hands the response to a renderer process, parses the HTML into a DOM while fetching CSS, scripts and images, and finally computes style, lays out, paints and composites the page.</title>
  <defs>
    <marker id="nv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="sm" x="680" y="14" text-anchor="end">what travels or is produced</text>

  <rect class="box" x="0" y="22" width="300" height="40" rx="6"/>
  <text class="strong" x="16" y="47">1 · Parse the URL</text>
  <text class="mono" x="680" y="47" text-anchor="end">https://example.com/</text>
  <line class="wire" x1="150" y1="62" x2="150" y2="72" marker-end="url(#nv-arrow)"/>

  <rect class="box" x="0" y="74" width="300" height="40" rx="6"/>
  <text class="strong" x="16" y="99">2 · Look up the name (DNS)</text>
  <text class="sm" x="680" y="99" text-anchor="end">example.com → an IP address</text>
  <line class="wire" x1="150" y1="114" x2="150" y2="124" marker-end="url(#nv-arrow)"/>

  <rect class="box" x="0" y="126" width="300" height="40" rx="6"/>
  <text class="strong" x="16" y="151">3 · Connect securely</text>
  <text class="sm" x="680" y="151" text-anchor="end">TCP + TLS 1.3, or QUIC (HTTP/3)</text>
  <line class="wire" x1="150" y1="166" x2="150" y2="176" marker-end="url(#nv-arrow)"/>

  <rect class="box" x="0" y="178" width="300" height="40" rx="6"/>
  <text class="strong" x="16" y="203">4 · Request and response</text>
  <text class="mono" x="680" y="203" text-anchor="end">GET / → 200 OK, text/html</text>
  <line class="wire" x1="150" y1="218" x2="150" y2="228" marker-end="url(#nv-arrow)"/>

  <rect class="box-accent" x="0" y="230" width="300" height="40" rx="6"/>
  <text class="strong" x="16" y="255">5 · Commit to a renderer</text>
  <text class="sm" x="680" y="255" text-anchor="end">the bytes go to the site's renderer process</text>
  <line class="wire" x1="150" y1="270" x2="150" y2="280" marker-end="url(#nv-arrow)"/>

  <rect class="box-accent" x="0" y="282" width="300" height="40" rx="6"/>
  <text class="strong" x="16" y="307">6 · Parse, and fetch more</text>
  <text class="sm" x="680" y="307" text-anchor="end">DOM and CSSOM; CSS, scripts, images requested</text>
  <line class="wire" x1="150" y1="322" x2="150" y2="332" marker-end="url(#nv-arrow)"/>

  <rect class="solid" x="0" y="334" width="300" height="40" rx="6"/>
  <text class="strong on-solid" x="16" y="359">7 · Render</text>
  <text class="sm" x="680" y="359" text-anchor="end">style → layout → paint → composite → pixels</text>
</svg>
