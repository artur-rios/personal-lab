<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" aria-labelledby="ss-title">
  <title id="ss-title">Solitary and sociable unit tests of the same class. On the left, a solitary test replaces every collaborator of the class under test with a test double, so only that one class runs. On the right, a sociable test lets the class use its real in-process collaborators and replaces only what is slow or outside the process, such as the database.</title>
  <defs>
    <marker id="ss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- Solitary -->
  <text class="strong" x="0" y="18">Solitary</text>
  <text class="sm" x="0" y="36">every collaborator is a double</text>
  <rect class="box" x="0" y="52" width="70" height="36" rx="4"/>
  <text x="35" y="75" text-anchor="middle">test</text>
  <line class="wire" x1="70" y1="70" x2="98" y2="70" marker-end="url(#ss-arrow)"/>
  <rect class="solid" x="100" y="52" width="110" height="36" rx="4"/>
  <text class="on-solid" x="155" y="75" text-anchor="middle">Order</text>
  <line class="wire" x1="155" y1="88" x2="155" y2="122" marker-end="url(#ss-arrow)"/>
  <line class="wire" x1="210" y1="70" x2="238" y2="70" marker-end="url(#ss-arrow)"/>
  <rect class="box-accent" x="100" y="124" width="110" height="36" rx="4"/>
  <text x="155" y="147" text-anchor="middle">double</text>
  <text class="sm" x="155" y="178" text-anchor="middle">for TaxTable</text>
  <rect class="box-accent" x="240" y="52" width="80" height="36" rx="4"/>
  <text x="280" y="75" text-anchor="middle">double</text>
  <text class="sm" x="280" y="106" text-anchor="middle">for Database</text>

  <rect class="zone" x="92" y="44" width="126" height="52" rx="6"/>
  <text class="sm accent" x="0" y="214">runs: one class</text>
  <text class="sm" x="0" y="232">a failure points at Order and nothing else</text>

  <line class="sep" x1="348" y1="0" x2="348" y2="240"/>

  <!-- Sociable -->
  <text class="strong" x="366" y="18">Sociable</text>
  <text class="sm" x="366" y="36">only slow or external parts are doubles</text>
  <rect class="box" x="366" y="52" width="70" height="36" rx="4"/>
  <text x="401" y="75" text-anchor="middle">test</text>
  <line class="wire" x1="436" y1="70" x2="464" y2="70" marker-end="url(#ss-arrow)"/>
  <rect class="solid" x="466" y="52" width="110" height="36" rx="4"/>
  <text class="on-solid" x="521" y="75" text-anchor="middle">Order</text>
  <line class="wire" x1="521" y1="88" x2="521" y2="122" marker-end="url(#ss-arrow)"/>
  <line class="wire" x1="576" y1="70" x2="598" y2="70" marker-end="url(#ss-arrow)"/>
  <rect class="solid" x="466" y="124" width="110" height="36" rx="4"/>
  <text class="on-solid" x="521" y="147" text-anchor="middle">TaxTable</text>
  <text class="sm" x="521" y="178" text-anchor="middle">the real one</text>
  <rect class="box-accent" x="600" y="52" width="78" height="36" rx="4"/>
  <text x="639" y="75" text-anchor="middle">double</text>
  <text class="sm" x="639" y="106" text-anchor="middle">for Database</text>

  <rect class="zone" x="458" y="44" width="126" height="124" rx="6"/>
  <text class="sm accent" x="366" y="214">runs: a small cluster of real objects</text>
  <text class="sm" x="366" y="232">a failure is in Order or TaxTable</text>
</svg>
