<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img" aria-labelledby="fp-title">
  <title id="fp-title">The four phases of a unit test. Setup builds the system under test and its inputs; exercise calls it; verify checks the result; teardown puts back anything the test changed. The same steps are called Arrange, Act and Assert, or Given, When and Then. Only the exercise step touches the system under test's behaviour; the verify step compares what came back with what was expected.</title>
  <defs>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <text class="sm" x="0" y="16">One test, from start to finish</text>

  <rect class="box" x="0" y="30" width="150" height="56" rx="6"/>
  <text class="strong" x="75" y="54" text-anchor="middle">1 Setup</text>
  <text class="sm" x="75" y="73" text-anchor="middle">build the object, inputs</text>

  <rect class="solid" x="176" y="30" width="150" height="56" rx="6"/>
  <text class="strong on-solid" x="251" y="54" text-anchor="middle">2 Exercise</text>
  <text class="sm on-solid" x="251" y="73" text-anchor="middle">call the code under test</text>

  <rect class="box-accent" x="352" y="30" width="150" height="56" rx="6"/>
  <text class="strong" x="427" y="54" text-anchor="middle">3 Verify</text>
  <text class="sm" x="427" y="73" text-anchor="middle">compare with expected</text>

  <rect class="box" x="528" y="30" width="150" height="56" rx="6"/>
  <text class="strong" x="603" y="54" text-anchor="middle">4 Teardown</text>
  <text class="sm" x="603" y="73" text-anchor="middle">undo what it changed</text>

  <line class="wire" x1="150" y1="58" x2="174" y2="58" marker-end="url(#fp-arrow)"/>
  <line class="wire" x1="326" y1="58" x2="350" y2="58" marker-end="url(#fp-arrow)"/>
  <line class="wire" x1="502" y1="58" x2="526" y2="58" marker-end="url(#fp-arrow)"/>

  <line class="sep" x1="0" y1="110" x2="678" y2="110"/>

  <text class="sm" x="0" y="136">Arrange, Act, Assert</text>
  <text class="mono" x="75" y="160" text-anchor="middle">Arrange</text>
  <text class="mono" x="251" y="160" text-anchor="middle">Act</text>
  <text class="mono" x="427" y="160" text-anchor="middle">Assert</text>
  <text class="sm" x="603" y="160" text-anchor="middle">(often automatic)</text>

  <text class="sm" x="0" y="190">Behaviour-driven style</text>
  <text class="mono" x="75" y="214" text-anchor="middle">Given</text>
  <text class="mono" x="251" y="214" text-anchor="middle">When</text>
  <text class="mono" x="427" y="214" text-anchor="middle">Then</text>
  <text class="sm" x="603" y="214" text-anchor="middle">(often automatic)</text>
</svg>
