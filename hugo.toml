baseURL = 'https://artur-rios.github.io/personal-lab/'
locale = 'en-us'
title = 'Artur Rios Lab'
theme = 'nuno'

# JSON is the search index the theme needs on the home page.
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    # Class-based highlighting, so the theme's palettes drive the colours.
    noClasses = false

[params]
  brand = 'Artur Rios Lab'
  description = 'Study notes, brainstorms and project tracking by Artur Rios, written in the open.'
  tagline = 'Study notes, brainstorms and projects.'
  masthead = 'Study<span class="accent">,</span><br>think<span class="accent">,</span><br>build.'
  mainSections = ['fundamentals', 'front-end', 'brainstorms', 'projects']

  [params.author]
    name = 'Artur Rios'

  # The theme appends an RSS link itself, so RSS is not listed here.
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/artur-rios'

[menu]
  [[menu.main]]
    identifier = 'fundamentals'
    name = 'Fundamentals'
    url = '/fundamentals/'
    weight = 10
  [[menu.main]]
    identifier = 'front-end'
    name = 'Front-end'
    url = '/front-end/'
    weight = 15
  [[menu.main]]
    identifier = 'brainstorms'
    name = 'Brainstorms'
    url = '/brainstorms/'
    weight = 20
  [[menu.main]]
    identifier = 'projects'
    name = 'Projects'
    url = '/projects/'
    weight = 30
